var li=lit()?1.9:.75,stn=H.cr?.45:(H.vx||H.st==='zip'||H.st==='climb'?1:.7),up=1-.12*(P.sh||0);return(.3+1.5*(1-ad/R))*li*stn*up*(look?.75:1)}
